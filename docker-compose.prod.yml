# Override file — has no image/build context of its own for `mongo`. Never run this
# file alone (it will fail with "service mongo has neither an image nor a build
# context specified"); use `npm run docker:prod`, or `docker compose -f
# docker-compose.yml -f docker-compose.prod.yml up -d`.
services:
  api:
    build:
      target: runtime
    environment:
      NODE_ENV: production
    restart: unless-stopped

  mongo:
    restart: unless-stopped
    volumes:
      - mongo-data-prod:/data/db

volumes:
  mongo-data-prod:
