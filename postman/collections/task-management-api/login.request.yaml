$kind: http-request
name: login
method: POST
url: "{{base_url}}/auth/login?login={{seed_user_email}}&password={{seed_user_password}}"
queryParams:
  - key: login
    value: "{{seed_user_email}}"
    disabled: false
    description: ""
  - key: password
    value: "{{seed_user_password}}"
    disabled: false
    description: ""
order: 2000
description: |-
  Logs in and returns a JWT. On a `200` response, the afterResponse script below saves the token into the `auth_token` collection variable, so every subsequent request's `Authorization: Bearer {{auth_token}}` header is filled in automatically — run this before any of the task/admin requests.

  **Auth required:** no.

  **Body**

  | Field    | Type   | Notes    |
  |----------|--------|----------|
  | email    | string | required |
  | password | string | required |

  **Response `200`:** `{ "token", "user": { "id", "name", "email", "role" } }`

  **Errors:** `400` invalid body, `401` wrong email/password.
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "ada@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      const json = pm.response.json();

      pm.test('Response contains token', function () {
        pm.expect(json.token).to.be.a('string').and.not.empty;
      });

      pm.test('Response contains user details', function () {
        pm.expect(json.user).to.be.an('object');
        pm.expect(json.user.id).to.be.a('string').and.not.empty;
        pm.expect(json.user.name).to.be.a('string').and.not.empty;
        pm.expect(json.user.email).to.eql('ada@example.com');
        pm.expect(json.user.role).to.be.oneOf(['user', 'admin']);
      });

      if (pm.response.code === 200 && json.token) {
        pm.collectionVariables.set('auth_token', json.token);
        pm.environment.set('auth_token', json.token);
      }
    language: text/javascript
