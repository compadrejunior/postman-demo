$kind: http-request
name: login
method: POST
url: "{{base_url}}/auth/login"
order: 2000
description: |-
  Logs in and returns a JWT. On a `200` response, the afterResponse script below saves the token into the `auth_token` collection variable, so every subsequent request's `Authorization: Bearer {{auth_token}}` header is filled in automatically — run this before any of the task/admin requests.

  The sample body authenticates the seeded regular user (`seed_user_email`/`seed_user_password` environment variables, populated by `npm run seed:dev`/`seed:test`/`seed:prod` — see docs/setup.md). To test the admin-only List All Tasks (Admin) request, swap in `{{seed_admin_email}}`/`{{seed_admin_password}}` before running Login.

  **Auth required:** no.

  **Body**

  | Field    | Type   | Notes    |
  |----------|--------|----------|
  | email    | string | required |
  | password | string | required |

  **Response `200`:** `{ "token", "user": { "id", "name", "email", "role" } }`

  **Errors:** `400` invalid body, `401` wrong email/password.
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{seed_user_email}}",
      "password": "{{seed_user_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        const json = pm.response.json();
        if (json.token) {
          pm.collectionVariables.set('auth_token', json.token);
        }
      }
    language: text/javascript
