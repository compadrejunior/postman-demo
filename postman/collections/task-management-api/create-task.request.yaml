$kind: http-request
method: POST
url: '{{base_url}}/tasks'
order: 3000
description: |-
  Creates a task owned by the caller. Requires `auth_token` to be set — run Login first. On a `201` response, the afterResponse script below saves the new task's id into the `task_id` collection variable, so Get/Update/Delete Task can use it right away.

  **Auth required:** yes.

  **Body**

  | Field       | Type              | Notes                                                           |
  |-------------|-------------------|-------------------------------------------------------------------|
  | title       | string            | required, non-empty                                                |
  | description | string            | optional, defaults to ""                                           |
  | status      | string            | optional, one of todo/in-progress/done, defaults to todo           |
  | priority    | string            | optional, one of low/medium/high, defaults to medium                |
  | dueDate     | string or null    | optional, ISO 8601 date-time, defaults to null                     |

  **Response `201`:** the created task (id, userId, title, description, status, priority, dueDate, createdAt, updatedAt).

  **Errors:** `400` invalid body, `401` missing/invalid token.
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{auth_token}}'
body:
  type: json
  content: |-
    {
      "title": "Write tests",
      "description": "Add integration coverage",
      "status": "todo",
      "priority": "high",
      "dueDate": null
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201 or 401', function () {
        pm.expect(pm.response.code).to.be.oneOf([201, 401]);
      });

      const contentType = pm.response.headers.get('Content-Type') || '';
      pm.test('Response is JSON', function () {
        pm.expect(contentType).to.include('application/json');
      });

      const json = pm.response.json();

      if (pm.response.code === 201) {
        pm.test('Created task has expected shape', function () {
          pm.expect(json).to.be.an('object');
          pm.expect(json.id).to.exist;
          pm.expect(json.title).to.eql('Write tests');
          pm.expect(json.description).to.eql('Add integration coverage');
          pm.expect(json.status).to.eql('todo');
          pm.expect(json.priority).to.eql('high');
          pm.expect(json).to.have.property('createdAt');
          pm.expect(json).to.have.property('updatedAt');
        });

        if (json.id) {
          pm.collectionVariables.set('task_id', json.id);
        }
      }

      if (pm.response.code === 401) {
        pm.test('Unauthorized error has expected shape', function () {
          pm.expect(json).to.have.property('error');
          pm.expect(json.error.code).to.eql('UNAUTHENTICATED');
          pm.expect(json.error.message).to.be.a('string').and.not.empty;
        });
      }

      pm.test('Response time is under 1000ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(1000);
      });
