$kind: http-request
method: PATCH
url: '{{base_url}}/tasks/{{task_id}}'
order: 6000
description: |-
  Partially updates a task. Requires `auth_token` and `task_id` to be set — run Login then Create Task first.

  **Auth required:** yes.

  **URL param:** `task_id` (path segment, filled in from the `task_id` collection variable).

  **Body:** any subset of `title`, `description`, `status`, `priority`, `dueDate` (same types/rules as Create Task) — at least one field required. The sample body only sends `status`; edit it to test other fields.

  **Response `200`:** the updated task.

  **Errors:** `400` invalid or empty body, `403` not the owner and not an admin, `404` no such task.
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{auth_token}}'
body:
  type: json
  content: |-
    {
      "status": "done"
    }
