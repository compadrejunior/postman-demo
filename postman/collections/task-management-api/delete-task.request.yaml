$kind: http-request
method: DELETE
url: '{{base_url}}/tasks/{{task_id}}'
order: 7000
description: |-
  Deletes a task. Requires `auth_token` and `task_id` to be set — run Login then Create Task first.

  **Auth required:** yes.

  **URL param:** `task_id` (path segment, filled in from the `task_id` collection variable).

  **Response `204`:** empty body.

  **Errors:** `403` not the owner and not an admin, `404` no such task.
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
