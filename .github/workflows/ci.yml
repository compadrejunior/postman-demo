name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: postman-demo:ci
      - name: Smoke-test container starts
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e MONGODB_URI=mongodb://localhost:27017/task-management \
            -e JWT_SECRET=ci-test-secret \
            postman-demo:ci
          sleep 3
          docker logs smoke
          docker stop smoke
